[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/tsconfigdotjson/vibe-os-native"

[workspace.dependencies]
vibe-core = { path = "crates/vibe-core" }
vibed = { path = "crates/vibed" }
libc = "0.2"
# SQLite is compiled in, so a Linux host needs no system library. Cross
# checks set LIBSQLITE3_SYS_USE_PKG_CONFIG=1 to skip that C build.
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml_edit = "0.25"
vt100 = "0.18"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Keep debug builds light: line tables are enough for backtraces, and
# dependencies carry no debug info at all. This keeps link memory down.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
strip = "debuginfo"
