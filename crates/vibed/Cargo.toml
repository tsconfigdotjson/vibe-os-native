[package]
name = "vibed"
description = "The VibeOS daemon: owns all state and serves the JSON-RPC socket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
vibe-core.workspace = true
vibe-env.workspace = true
vibe-mcp.workspace = true
vibe-relay.workspace = true
vibe-services.workspace = true
vibe-status.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true

[dev-dependencies]
# Tests' webhook receivers serve HTTPS with a test CA, which vibe-mcp's
# test-roots feature trusts.
rustls.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
vibe-mcp = { workspace = true, features = ["test-roots"] }
rusqlite.workspace = true
tempfile.workspace = true

[lints]
workspace = true
