[package]
name = "vibe-cli"
description = "The vibe command: attach, ls, rpc and host setup, as a client of vibed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vibe"
path = "src/main.rs"

[dependencies]
vibe-core.workspace = true
vibe-relay.workspace = true
libc.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Tests' webhook receivers serve HTTPS with a test CA, which vibe-mcp's
# test-roots feature trusts.
rustls.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
vibe-mcp = { workspace = true, features = ["test-roots"] }
vibe-env.workspace = true
vibe-services.workspace = true
vibed.workspace = true
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true
