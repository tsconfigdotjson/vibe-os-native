[package]
name = "vibe-mcp"
description = "The VibeOS MCP server, a facade on the vibed core built with rmcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
vibe-core.workspace = true
vibe-status.workspace = true
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc.workspace = true
# Only the server side, over Streamable HTTP; `vibe mcp` bridges stdio to it.
rmcp = { version = "3.8", default-features = false, features = ["server", "transport-streamable-http-server"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-service = "0.3"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
